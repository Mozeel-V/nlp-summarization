[build-system]
requires = ["setuptools>=61.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "summarizer"
version = "0.1.0"
description = "Extractive, Abstractive summarization baselines with a hybrid pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mozeel Vanwani" }]

dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.7",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/Mozeel-V/nlp-summarization"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "checkpoints",
    "config",
    "data",
    "decode",
    "evaluation",
    "extraction",
    "graph",
    "metrics",
    "model",
    "trainer",
    "vocab",
]

# ─── Tool Configuration ─────────────────────────────────────────────────────

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "checkpoints",
    "config",
    "data",
    "decode",
    "evaluation",
    "extraction",
    "graph",
    "metrics",
    "model",
    "trainer",
    "vocab",
]
combine-as-imports = true
force-sort-within-sections = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
extraPaths = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
reportMissingImports = "none"
